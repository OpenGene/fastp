name: fastp ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build dependencies
        uses: ./.github/actions/build-deps

      - name: build fastp
        run: make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: smoke test
        run: |
          ./fastp --version
          ./fastp -i testdata/R1.fq -o /dev/null

      - name: unit tests
        run: ./fastp test

      # identical output at 1..48 worker threads in every output mode, no hangs
      # (#721), and adapter auto-detection finds the planted adapter. The Linux
      # build is fully static, so relink the same objects against dynamic glibc
      # for the check: fake_nprocs.c needs LD_PRELOAD to lift fastp's -w cap.
      - name: correctness checks
        run: |
          bin=./fastp
          if [ "$RUNNER_OS" = Linux ]; then
            g++ obj/*.o -o fastp-dynamic -L/usr/local/lib -pthread -lisal -ldeflate -lhwy
            bin=./fastp-dynamic
          fi
          python3 .github/scripts/check_correctness.py "$bin"

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fastp-${{ runner.os }}-${{ runner.arch }}
          path: fastp
